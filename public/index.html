<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/styles.css">
  
</head>
<body>
  <div class="body-height">
    <header class="header">
      
        <div class="header__leftside">
          <div class="prelogo-section">
            
            <div class="prelogo-section__shadow"></div>
  
            <nav class="start-navigation">
              <button class="start-navigation__btn">
                <div class="start-navigation__icon">
                  <img src="./images/settingsDota2Icon.svg" alt="">
                </div>
              </button>
              <button class="start-navigation__btn">
                <div class="start-navigation__icon">
                  <img src="./images/arrowLeftDota2Icon.svg" alt="">
                </div>
                <div class="start-navigation__icon">
                  <img src="./images/arrowRightDota2Icon.svg" alt="">
                </div>
              </button>
            </nav>
          </div>
          
  
          <div class="logo-section">
            <img class="logo-section__image" src="./images/logo.png" alt="">
            <div class="logo-section__forward-layer">
              <div class="logo-section__shadow"></div>
            </div>
            <div class="logo-section__second-layer"></div>
          </div>
  
          <nav class="main-navigation">
            <button type="button" class="main-navigation__btn">
              <div class="main-navigation__text">Heroes</div>
            </button>
            <button type="button" class="main-navigation__btn">
              <div class="main-navigation__text">Watch</div>
            </button>
            <button type="button" class="main-navigation__btn">
              <div class="main-navigation__text">Learn</div>
            </button> 
            <button type="button" class="main-navigation__btn main-navigation__btn--active">
              <div class="main-navigation__text">Custom Games</div>
            </button>                     
          </nav>
        </div>
        <div class="header__rightside">
          <nav class="end-navigation">
            <div class="gold-info">
              <div class="gold-info__icon">
                <img src="./images/goldDota2Icon.svg" alt="">
              </div>
              <div class="gold-info__currency">
                2700
              </div>
            </div>
            <button class="end-navigation__btn">
              <div class="end-navigation__icon">
                <img src="./images/shieldDota2Icon.svg" alt="">
              </div> 
            </button>
            <button class="end-navigation__btn">
              <div class="end-navigation__icon">
                <img src="./images/shieldDota2Icon.svg" alt=""> 
              </div>
            </button>
            <button class="end-navigation__btn">
              <div class="end-navigation__icon">
                <img src="./images/plusGoldDota2Icon.svg" alt=""> 
              </div>
            </button>
            <button class="end-navigation__btn">
              <div class="end-navigation__icon">
                <img src="./images/powerDota2Icon.svg" alt="">
              </div>
            </button>
            <div class="end-navigation__last-item"></div>
          </nav>
        </div>
      
    </header>
    <main>
      <div class="container">
        <div class="heroes-menu" id="heroes"></div>   
      </div>
    </main>
  </div>
  <footer class="footer">
    <div class="footer__empty"></div>
    <div class="footer__middle">
      <div class="chat-input">
        <div class="left-section">
          <div class="username-section">
            user name:
          </div>
          <div class="message">Hello world</div>
        </div>
        <div class="right-section">
          
        </div>

      </div>
    </div>
    <div class="footer__end start">
      <button type="button" class="start__button">
        <div class="start__text">play dota</div>
      </button>

    </div>
  </footer>

  <script type="module" src="/js/script.js"></script>
</body>
</html>
